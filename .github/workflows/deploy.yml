name: Deploy do Tema KingHost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar arquivos via Git-FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          sudo apt-get update && sudo apt-get install -y git-ftp

          # Higieniza o host
          CLEAN_HOST=$(echo "$FTP_HOST" | sed -e 's|^ftp://||' -e 's|/||g')

          # Mapeia as pastas visiveis na raiz do usuario FTP
          ROOT_DIRS=$(curl -s --insecure -l -u "$FTP_USER:$FTP_PASS" "ftp://${CLEAN_HOST}/" || true)

          echo "Pastas encontradas no FTP:"
          echo "$ROOT_DIRS"

          # Define o caminho dinamico com base no nivel de acesso do usuario
          if echo "$ROOT_DIRS" | grep -qx "www"; then
            REMOTE_PATH="www/wp-content/themes/aline-wp-theme"
          elif echo "$ROOT_DIRS" | grep -qx "wp-content"; then
            REMOTE_PATH="wp-content/themes/aline-wp-theme"
          elif echo "$ROOT_DIRS" | grep -qx "themes"; then
            REMOTE_PATH="themes/aline-wp-theme"
          else
            REMOTE_PATH="aline-wp-theme"
          fi

          echo "Caminho resolvido: $REMOTE_PATH"

          # Garante a existencia do diretorio de destino
          curl --ftp-create-dirs --insecure -u "$FTP_USER:$FTP_PASS" "ftp://${CLEAN_HOST}/${REMOTE_PATH}/style.css" -T style.css || true

          # Configura e executa o git-ftp
          git config git-ftp.user "$FTP_USER"
          git config git-ftp.password "$FTP_PASS"
          git config git-ftp.url "ftp://${CLEAN_HOST}/${REMOTE_PATH}/"

          git ftp init --insecure || git ftp push --insecure