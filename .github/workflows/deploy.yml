name: Deploy do Tema KingHost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar arquivos via Git-FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          sudo apt-get update && sudo apt-get install -y git-ftp

          # Higieniza o host para evitar duplicacao de protocolo ou barras
          CLEAN_HOST=$(echo "$FTP_HOST" | sed -e 's|^ftp://||' -e 's|/||g')

          # Configura as credenciais e a URL de destino
          git ftp config --user "$FTP_USER" --passwd "$FTP_PASS" --url "ftp://${CLEAN_HOST}/wp-content/themes/aline-wp-theme/"

          # Executa a inicializacao ou a sincronizacao
          git ftp init -v --passive --insecure || git ftp push -v --passive --insecure