name: Deploy do Tema KingHost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sincronizar arquivos via Git-FTP
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER }}
        run: |
          sudo apt-get update && sudo apt-get install -y git-ftp

          # Limpa o endereco do host
          CLEAN_HOST=$(echo "$FTP_HOST" | sed -e 's|^ftp://||' -e 's|/||g')

          # Forca a criacao da pasta no servidor FTP caso nao exista
          curl --ftp-create-dirs --insecure -u "$FTP_USER:$FTP_PASS" "ftp://${CLEAN_HOST}/www/wp-content/themes/aline-wp-theme/style.css" -T style.css || true

          # Configura as credenciais no Git
          git config git-ftp.user "$FTP_USER"
          git config git-ftp.password "$FTP_PASS"
          git config git-ftp.url "ftp://${CLEAN_HOST}/www/wp-content/themes/aline-wp-theme/"

          # Executa o envio
          git ftp init --insecure || git ftp push --insecure