name: Deploy do Tema KingHost

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessario para o git-ftp comparar as alteracoes

      - name: Sincronizar arquivos via Git-FTP
        run: |
          sudo apt-get update && sudo apt-get install -y git-ftp
          git ftp config --user "${{ secrets.FTP_USERNAME }}" --passwd "${{ secrets.FTP_PASSWORD }}" --url "ftp://${{ secrets.FTP_SERVER }}/www/wp-content/themes/aline-wp-theme/"
          git ftp push --auto-init